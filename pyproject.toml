[tool.poetry]
name = "my kuvar api"
version = "0.1.0"
description = "REST API for cooking recipes with authentication"
authors = ["Jalil Karimov <karimov.jalil@mail.ru>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = "^0.37.0"
sqlalchemy = "^2.0.44"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.1.1"
python-jose = "^3.5.0"
passlib = "^1.7.4"
python-multipart = "^0.0.20"
pydantic-settings = "^2.11.0"
fastapi = "^0.119.0"
pydantic = {extras = ["email"], version = "^2.12.2"}

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "auth: tests for authentication",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
