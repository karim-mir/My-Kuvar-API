[tool.poetry]
name = "my kuvar api"
version = "0.1.0"
description = "REST API for cooking recipes with authentication"
authors = ["Jalil Karimov <karimov.jalil@mail.ru>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
uvicorn = "^0.37.0"
sqlalchemy = "^2.0.44"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.1.1"
python-jose = "^3.5.0"
passlib = "^1.7.4"
python-multipart = "^0.0.20"
pydantic-settings = "^2.11.0"
fastapi = "^0.119.0"
pydantic = {extras = ["email"], version = "^2.12.2"}
flake8 = "^7.3.0"
black = "^25.9.0"
isort = "^7.0.0"
bcrypt = "4.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.24.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config"
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "auth: tests for authentication",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "app/__init__.py",
    "app/main.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "print\\(",
    "logger\\.",
]
show_missing = true
skip_covered = false
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"
title = "My Kuvar API Test Coverage"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
